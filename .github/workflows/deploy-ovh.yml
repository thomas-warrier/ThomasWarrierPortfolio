name: Deploy to OVH

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload site to OVH via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.OVH_FTP_SERVER }}
          username: ${{ secrets.OVH_FTP_USER }}
          password: ${{ secrets.OVH_FTP_PASSWORD }}
          protocol: ftps
          server-dir: ./www/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .vscode/**
            k8s/**
            Dockerfile
            nginx.conf
            .dockerignore
            README.md
